upstream local_deals_api {
  least_conn;
  server api-1:3001 max_fails=3 fail_timeout=10s;
  server api-2:3001 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  # This is intentionally an upstream readiness probe, not a process-only
  # probe. It keeps the internal gateway out of rotation when neither API
  # replica can accept requests.
  location = /healthz {
    proxy_pass http://local_deals_api/api/v1/public/health/ready;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }

  location /api/ {
    proxy_pass http://local_deals_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The workspace Nginx creates this correlation id. Preserve it across the
    # internal hop so access logs, API responses and audit records line up.
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # Do not add the `non_idempotent` option: failed POSTs must be resolved by
    # the application idempotency contract, never replayed by a proxy.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
  }
}
